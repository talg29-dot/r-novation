<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes travaux de rénovation</title>
  <style>
    :root {
      --bg-color: #f4f0f5;
      --card-bg: #ffffff;
      --text-color: #3c3c50;
      --primary-color: #111827;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; font-size: 14px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-title h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
    .header-title p { color: #6b7280; font-size: 0.85rem; }
    .header-btns { display: flex; gap: 10px; align-items: center; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
    .btn-dark { background-color: var(--primary-color); color: white; }
    .btn-float { background-color: #1f2937; }
    .btn-outline { background-color: white; border: 1px solid var(--border-color); color: #4b5563; }
    .btn-danger { background-color: #ef4444; color: white; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
    .stat-card span { font-size: 0.75rem; color: #6b7280; font-weight: 600; text-transform: uppercase; }
    .stat-card .amount { font-size: 1.3rem; font-weight: bold; margin-top: 5px; }
    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent-orange); width: 0%; transition: width 0.3s; }

    .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .card h2 { font-size: 1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; }
    .form-row { display: flex; gap: 10px; }

    .item-list { list-style: none; }
    .item-card { border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-info strong { display: block; font-size: 0.9rem; }
    .item-info small { color: #6b7280; font-size: 0.75rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; margin-top: 4px; }
    .badge-reelle { background-color: #d1fae5; color: #065f46; }
    .badge-estimee { background-color: #fef3c7; color: #92400e; }

    .actions { display: flex; gap: 8px; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }

    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #f59e0b; }
    .status-online { background-color: #10b981; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1>🔨 Mes travaux de rénovation</h1>
      <p>Suivi global des dépenses et devis</p>
    </div>
    <div class="header-btns">
      <div class="sync-status">
        <div id="syncDot" class="status-dot"></div>
        <span id="syncText">Connexion...</span>
      </div>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span>Budget global défini</span>
      <div class="amount" id="statBudget">0,00 €</div>
    </div>
    <div class="stat-card">
      <span>Dépenses réelles</span>
      <div class="amount" id="statReal">0,00 €</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="stat-card">
      <span>Restant théorique</span>
      <div class="amount" id="statRemaining">0,00 €</div>
    </div>
  </div>

  <div class="main-grid">
    <div>
      <div class="card">
        <h2>Paramétrer le budget</h2>
        <div class="form-group">
          <label>Budget total (€)</label>
          <input type="number" id="globalBudgetInput" placeholder="Ex: 50000">
        </div>
        <button class="btn-dark" onclick="saveBudget()">Enregistrer le budget</button>
      </div>

      <div class="card">
        <h2>Ajouter une ligne</h2>
        <form id="addForm">
          <div class="form-group">
            <label>Intitulé</label>
            <input type="text" id="itemName" placeholder="Ex: Peinture salon" required>
          </div>
          <div class="form-group">
            <label>Catégorie / Pièce</label>
            <input type="text" id="itemCategory" placeholder="Ex: Salon, Plomberie..." required>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>Montant (€)</label>
              <input type="number" step="0.01" id="itemAmount" placeholder="0.00" required>
            </div>
            <div class="form-group" style="flex:1;">
              <label>Type</label>
              <select id="itemType">
                <option value="reelle">Réelle</option>
                <option value="estimee">Estimée</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-dark" style="width:100%;">Ajouter</button>
        </form>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Liste des dépenses & estimations</h2>
        <ul class="item-list" id="itemList">
          <!-- Les éléments s'affichent ici -->
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBgGKXYVSi1RbZH498K6TASjdJ3sd-ZWI",
    authDomain: "renovation-maison-f6067.firebaseapp.com",
    projectId: "renovation-maison-f6067",
    storageBucket: "renovation-maison-f6067.firebasestorage.app",
    messagingSenderId: "562445834331",
    appId: "1:562445834331:web:e5ead196bb361dc77d707e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let globalBudget = 0;
  let items = [];

  // Écoute synchro
  onSnapshot(doc(db, "config", "budget"), (docSnap) => {
    if (docSnap.exists()) {
      globalBudget = docSnap.data().amount || 0;
      document.getElementById('globalBudgetInput').value = globalBudget;
    }
    updateUI();
  });

  onSnapshot(collection(db, "expenses"), (snapshot) => {
    document.getElementById('syncDot').classList.add('status-online');
    document.getElementById('syncText').textContent = "Synchronisé";
    
    items = [];
    snapshot.forEach((doc) => {
      items.push({ id: doc.id, ...doc.data() });
    });
    updateUI();
  });

  window.saveBudget = async function() {
    const val = parseFloat(document.getElementById('globalBudgetInput').value) || 0;
    await setDoc(doc(db, "config", "budget"), { amount: val });
  };

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('itemName').value;
    const category = document.getElementById('itemCategory').value;
    const amount = parseFloat(document.getElementById('itemAmount').value) || 0;
    const type = document.getElementById('itemType').value;

    await addDoc(collection(db, "expenses"), {
      name, category, amount, type, date: new Date().toISOString()
    });

    document.getElementById('addForm').reset();
  });

  window.deleteItem = async function(id) {
    await deleteDoc(doc(db, "expenses", id));
  };

  function updateUI() {
    const listEl = document.getElementById('itemList');
    listEl.innerHTML = '';

    let totalReal = 0;

    items.forEach(item => {
      if (item.type === 'reelle') totalReal += item.amount;

      const li = document.createElement('li');
      li.className = 'item-card';
      li.innerHTML = `
        <div class="item-info">
          <strong>${item.name}</strong>
          <small>${item.category}</small><br>
          <span class="badge ${item.type === 'reelle' ? 'badge-reelle' : 'badge-estimee'}">
            ${item.type === 'reelle' ? 'Dépense réelle' : 'Estimation'}
          </span>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:bold; font-size:1rem;">${item.amount.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' })}</div>
          <button class="btn-danger btn-sm" style="margin-top:5px;" onclick="deleteItem('${item.id}')">Supprimer</button>
        </div>
      `;
      listEl.appendChild(li);
    });

    document.getElementById('statBudget').textContent = globalBudget.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    document.getElementById('statReal').textContent = totalReal.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    
    const remaining = globalBudget - totalReal;
    document.getElementById('statRemaining').textContent = remaining.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });

    const pct = globalBudget > 0 ? Math.min((totalReal / globalBudget) * 100, 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
  }
</script>

</body>
</html>
